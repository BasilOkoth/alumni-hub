
databases:
  - name: alumni-hub-db
    databaseName: alumnihub
    user: alumnihub

services:
  - type: web
    name: alumni-hub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PIN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: alumni-hub-db
          property: connectionString
      - key: BASE_URL
        sync: false
      - key: COMMUNITY_NAME
        value: Alumni Circle
      - key: COMMUNITY_TAGLINE
        value: Support each other. Open doors. Build a legacy.
      - key: COMMUNITY_SIZE
        value: "66"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
