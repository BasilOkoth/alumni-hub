{% extends 'base.html' %}{% block title %}Admin — Alumni Hub{% endblock %}{% block content %}<section class="admin-head"><span class="eyebrow">ADMIN</span><h1>Member administration.</h1></section><section class="section"><div class="admin-table">{% for m in members %}<div class="admin-row"><div><strong>{{m.name}}</strong><small>{{m.phone}} • {{m.profession}}</small></div><form method="post" action="{{url_for('update_member_status',member_id=m.id)}}" class="inline-form"><select name="welfare_status"><option {% if m.welfare_status=='Network only' %}selected{% endif %}>Network only</option><option {% if m.welfare_status=='Active' %}selected{% endif %}>Active</option></select><input type="number" name="annual_commitment" value="{{m.annual_commitment|round(0)|int}}"><button class="btn tiny">Save</button></form></div>{% endfor %}</div></section>{% endblock %}
